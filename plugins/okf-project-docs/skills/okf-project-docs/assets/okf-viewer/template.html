<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>OKF 文档浏览器</title>
  <style>
    :root {
      --bg: #f5f3ee;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-solid: #fffefa;
      --panel-muted: #efede7;
      --text: #222522;
      --muted: #6d706c;
      --faint: #959891;
      --line: rgba(34, 37, 34, 0.12);
      --line-strong: rgba(34, 37, 34, 0.22);
      --accent: #276b57;
      --accent-strong: #174f3e;
      --accent-soft: #dcebe4;
      --code-bg: #202623;
      --code-text: #eef5ef;
      --shadow: 0 18px 55px rgba(48, 43, 34, 0.10);
      --sidebar-width: 292px;
      --outline-width: 214px;
      --radius: 16px;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    :root[data-theme="dark"] {
      --bg: #151815;
      --panel: rgba(28, 32, 29, 0.88);
      --panel-solid: #1c201d;
      --panel-muted: #242925;
      --text: #edf0eb;
      --muted: #a7aca6;
      --faint: #777e78;
      --line: rgba(240, 246, 239, 0.11);
      --line-strong: rgba(240, 246, 239, 0.22);
      --accent: #78c3a7;
      --accent-strong: #a4ddc8;
      --accent-soft: #263f35;
      --code-bg: #0f1210;
      --code-text: #e5eee8;
      --shadow: 0 20px 64px rgba(0, 0, 0, 0.30);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 15% 0%, rgba(79, 142, 112, 0.10), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: var(--accent-strong); }
    code { font-family: var(--mono); }

    .app { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 30;
      display: flex;
      width: var(--sidebar-width);
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(22px) saturate(1.25);
      transition: transform 180ms ease;
    }
    .brand {
      padding: 22px 20px 15px;
    }
    .brand-copy { min-width: 0; }
    .brand-title { font-size: 14px; font-weight: 760; letter-spacing: 0.02em; }
    .brand-subtitle { margin-top: 3px; color: var(--muted); font-size: 11px; }

    .search-wrap { padding: 0 15px 12px; }
    .search {
      width: 100%;
      height: 38px;
      padding: 0 12px 0 34px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      background:
        linear-gradient(45deg, transparent 48%, var(--muted) 49% 53%, transparent 54%) 18px 22px / 7px 7px no-repeat,
        radial-gradient(circle, transparent 43%, var(--muted) 44% 58%, transparent 59%) 10px 9px / 15px 15px no-repeat,
        var(--panel-solid);
      color: var(--text);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
    }
    .search::placeholder { color: var(--faint); }

    .file-tree {
      flex: 1;
      overflow: auto;
      padding: 2px 10px 20px;
      scrollbar-width: thin;
    }
    .tree-folder { margin: 5px 0; }
    .tree-folder > summary {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 9px;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 720;
      letter-spacing: 0.07em;
      list-style: none;
      text-transform: uppercase;
      user-select: none;
    }
    .tree-folder > summary::-webkit-details-marker { display: none; }
    .tree-folder > summary::before {
      content: "›";
      display: inline-block;
      font-size: 16px;
      line-height: 1;
      transform: rotate(0deg);
      transition: transform 150ms ease;
    }
    .tree-folder[open] > summary::before { transform: rotate(90deg); }
    .tree-children { margin-left: 8px; border-left: 1px solid var(--line); padding-left: 6px; }
    .file-link {
      display: grid;
      width: 100%;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin: 2px 0;
      padding: 8px 9px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: background 140ms ease, color 140ms ease;
    }
    .file-link:hover { background: var(--panel-muted); }
    .file-link.is-active { background: var(--accent-soft); color: var(--accent-strong); }
    .file-name { overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .file-kind {
      align-self: center;
      max-width: 72px;
      overflow: hidden;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .search-path {
      grid-column: 1 / -1;
      overflow: hidden;
      margin-top: -4px;
      color: var(--faint);
      font-family: var(--mono);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .empty-state { padding: 30px 16px; color: var(--muted); font-size: 13px; line-height: 1.7; text-align: center; }
    .sidebar-foot {
      display: flex;
      justify-content: space-between;
      padding: 12px 18px 16px;
      border-top: 1px solid var(--line);
      color: var(--faint);
      font-family: var(--mono);
      font-size: 10px;
    }

    .main { min-height: 100vh; margin-left: var(--sidebar-width); transition: margin-left 180ms ease; }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      height: 58px;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 76%, transparent);
      backdrop-filter: blur(18px);
    }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .menu-button { display: inline-grid; flex: 0 0 auto; }
    .icon-button, .diagram-button {
      display: inline-grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel-solid);
      cursor: pointer;
      transition: transform 130ms ease, border-color 130ms ease, background 130ms ease;
    }
    .icon-button:hover, .diagram-button:hover { border-color: var(--line-strong); background: var(--panel-muted); }
    .icon-button:active, .diagram-button:active { transform: scale(0.96); }
    .path-label {
      overflow: hidden;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) var(--outline-width); gap: 36px; max-width: 1260px; margin: 0 auto; padding: 46px 42px 110px; }
    .document { min-width: 0; max-width: 820px; }
    .outline { position: sticky; top: 90px; align-self: start; max-height: calc(100vh - 120px); overflow: auto; padding-left: 16px; border-left: 1px solid var(--line); }
    .outline-title { margin-bottom: 10px; color: var(--faint); font-size: 10px; font-weight: 760; letter-spacing: 0.11em; text-transform: uppercase; }
    .outline a { display: block; margin: 7px 0; color: var(--muted); font-size: 11px; line-height: 1.45; text-decoration: none; }
    .outline a:hover { color: var(--accent-strong); }
    .outline a[data-level="3"] { padding-left: 10px; }
    .outline a[data-level="4"], .outline a[data-level="5"], .outline a[data-level="6"] { padding-left: 20px; }

    .doc-header { margin-bottom: 34px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
    .doc-eyebrow { margin-bottom: 12px; color: var(--accent); font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; }
    .doc-title { margin: 0; font-size: clamp(30px, 5vw, 48px); font-weight: 760; letter-spacing: -0.04em; line-height: 1.08; }
    .doc-description { max-width: 680px; margin: 16px 0 0; color: var(--muted); font-size: 16px; line-height: 1.75; }
    .metadata { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 18px; }
    .metadata-item { padding: 5px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .metadata-key { color: var(--faint); }

    .markdown-body { font-size: 15px; line-height: 1.8; }
    .markdown-body > :first-child { margin-top: 0; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 { scroll-margin-top: 84px; color: var(--text); line-height: 1.3; }
    .markdown-body h1 { margin: 2.2em 0 0.8em; font-size: 30px; letter-spacing: -0.03em; }
    .markdown-body h2 { margin: 2.1em 0 0.75em; padding-bottom: 0.35em; border-bottom: 1px solid var(--line); font-size: 23px; letter-spacing: -0.02em; }
    .markdown-body h3 { margin: 1.8em 0 0.65em; font-size: 18px; }
    .markdown-body h4, .markdown-body h5, .markdown-body h6 { margin: 1.6em 0 0.55em; font-size: 15px; }
    .markdown-body p { margin: 0.9em 0; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.5em; }
    .markdown-body li { margin: 0.35em 0; }
    .markdown-body blockquote { margin: 1.2em 0; padding: 0.6em 1em; border-left: 3px solid var(--accent); background: var(--accent-soft); color: var(--muted); }
    .markdown-body blockquote p { margin: 0.25em 0; }
    .markdown-body hr { height: 1px; margin: 2.2em 0; border: 0; background: var(--line); }
    .markdown-body a { text-decoration-color: color-mix(in srgb, var(--accent) 45%, transparent); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    .markdown-body img { display: block; max-width: 100%; height: auto; margin: 1.5em auto; border-radius: 12px; box-shadow: var(--shadow); }
    .markdown-body :not(pre) > code { padding: 0.16em 0.4em; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-muted); color: var(--accent-strong); font-size: 0.88em; }
    .code-block { position: relative; margin: 1.35em 0; overflow: auto; border-radius: 12px; background: var(--code-bg); color: var(--code-text); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
    .code-language { position: absolute; top: 9px; right: 12px; color: #8f9b93; font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
    .code-block pre { margin: 0; padding: 20px; }
    .code-block code { font-size: 12px; line-height: 1.65; }
    .table-wrap { margin: 1.35em 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
    .markdown-body table { width: 100%; border-collapse: collapse; background: var(--panel-solid); font-size: 13px; }
    .markdown-body th, .markdown-body td { padding: 10px 13px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .markdown-body th { background: var(--panel-muted); font-weight: 700; }
    .markdown-body tr:last-child td { border-bottom: 0; }
    .task { list-style: none; margin-left: -1.35em; }
    .task input { margin-right: 8px; accent-color: var(--accent); }

    .diagram-card { margin: 1.6em 0; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel-solid); box-shadow: var(--shadow); }
    .diagram-head { display: flex; height: 44px; align-items: center; justify-content: space-between; padding: 0 10px 0 15px; border-bottom: 1px solid var(--line); }
    .diagram-label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; }
    .diagram-label::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .diagram-actions { display: flex; gap: 5px; }
    .diagram-button { width: 28px; height: 28px; border-radius: 7px; font-size: 13px; }
    .diagram-viewport { position: relative; height: min(58vh, 520px); min-height: 310px; overflow: hidden; outline: none; background-color: var(--panel-muted); background-image: radial-gradient(var(--line-strong) 0.75px, transparent 0.75px); background-size: 16px 16px; cursor: grab; touch-action: none; }
    .diagram-viewport:active { cursor: grabbing; }
    .diagram-viewport:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
    .diagram-canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
    .diagram-canvas svg { display: block; max-width: none !important; height: auto; }
    .diagram-loading { padding: 32px; color: var(--muted); font-size: 12px; }
    .diagram-error { margin: 0; padding: 22px; color: #a33a3a; font-family: var(--mono); font-size: 11px; white-space: pre-wrap; }
    .diagram-source { border-top: 1px solid var(--line); }
    .diagram-source summary { padding: 9px 14px; color: var(--muted); cursor: pointer; font-size: 10px; }
    .diagram-source pre { max-height: 260px; margin: 0; overflow: auto; padding: 14px; border-top: 1px solid var(--line); background: var(--code-bg); color: var(--code-text); font-size: 11px; line-height: 1.5; }
    .diagram-card.is-expanded { position: fixed; inset: 16px; z-index: 100; display: flex; margin: 0; flex-direction: column; }
    .diagram-card.is-expanded .diagram-viewport { height: auto; flex: 1; }
    .diagram-card.is-expanded .diagram-source { display: none; }
    body.has-expanded-diagram { overflow: hidden; }

    .sidebar-scrim { display: none; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 200; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-solid); box-shadow: var(--shadow); color: var(--muted); font-size: 12px; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity 160ms ease, transform 160ms ease; }
    .toast.is-visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 1080px) {
      .workspace { grid-template-columns: minmax(0, 1fr); max-width: 900px; }
      .outline { display: none; }
    }
    @media (min-width: 761px) {
      body.sidebar-collapsed .sidebar { transform: translateX(-102%); pointer-events: none; }
      body.sidebar-collapsed .main { margin-left: 0; }
    }
    @media (max-width: 760px) {
      .sidebar { transform: translateX(-102%); }
      .sidebar.is-open { transform: translateX(0); }
      .sidebar-scrim { position: fixed; inset: 0; z-index: 25; display: block; border: 0; background: rgba(0,0,0,0.35); opacity: 0; pointer-events: none; transition: opacity 180ms ease; }
      .sidebar-scrim.is-open { opacity: 1; pointer-events: auto; }
      .main { margin-left: 0; }
      .workspace { padding: 32px 20px 90px; }
      .toolbar { padding: 0 12px; }
      .doc-title { font-size: 34px; }
      .diagram-viewport { min-height: 270px; }
      .diagram-card.is-expanded { inset: 0; border: 0; border-radius: 0; }
    }
    @media print {
      .sidebar, .toolbar, .outline, .diagram-actions, .diagram-source { display: none !important; }
      .main { margin: 0; }
      .workspace { display: block; max-width: none; padding: 0; }
      .document { max-width: none; }
      .diagram-viewport { height: auto; min-height: 0; overflow: visible; background: none; }
      .diagram-canvas { position: static; transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-copy">
          <div class="brand-title">OKF Explorer</div>
          <div class="brand-subtitle">Open Knowledge Format</div>
        </div>
      </div>
      <div class="search-wrap">
        <input class="search" id="search" type="search" placeholder="搜索标题、路径或正文…" autocomplete="off">
      </div>
      <nav class="file-tree" id="file-tree" aria-label="文档目录"></nav>
      <div class="sidebar-foot"><span id="file-count"></span><span>STATIC · v1</span></div>
    </aside>
    <button class="sidebar-scrim" id="sidebar-scrim" aria-label="关闭目录"></button>

    <main class="main">
      <header class="toolbar">
        <div class="toolbar-left">
          <button class="icon-button menu-button" id="menu-button" aria-label="收起文件目录" aria-controls="sidebar" aria-expanded="true" title="收起文件目录">☰</button>
          <span class="path-label" id="path-label"></span>
        </div>
        <div class="toolbar-right">
          <button class="icon-button" id="copy-link" aria-label="复制文档路径" title="复制文档路径">⌘</button>
          <button class="icon-button" id="theme-button" aria-label="切换明暗主题" title="切换明暗主题">◐</button>
        </div>
      </header>

      <div class="workspace">
        <article class="document" id="document"></article>
        <aside class="outline" id="outline" aria-label="本页目录"></aside>
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script type="application/json" id="okf-data">__OKF_DATA__</script>
  <script>/*__MERMAID_RUNTIME__*/</script>
  <script>
    (() => {
      const payload = JSON.parse(document.getElementById("okf-data").textContent)
      const files = payload.files.map((file) => ({ ...file, name: file.name || file.path.split("/").pop() }))
      const filesByPath = new Map(files.map((file) => [file.path, file]))
      const diagramStates = new WeakMap()
      const elements = {
        sidebar: document.getElementById("sidebar"),
        scrim: document.getElementById("sidebar-scrim"),
        menu: document.getElementById("menu-button"),
        search: document.getElementById("search"),
        tree: document.getElementById("file-tree"),
        count: document.getElementById("file-count"),
        path: document.getElementById("path-label"),
        document: document.getElementById("document"),
        outline: document.getElementById("outline"),
        copy: document.getElementById("copy-link"),
        theme: document.getElementById("theme-button"),
        toast: document.getElementById("toast"),
      }
      const initialHash = decodeURIComponent(location.hash.slice(1))
      let currentPath = filesByPath.has(initialHash)
        ? initialHash
        : filesByPath.has("index.md")
          ? "index.md"
          : filesByPath.has("project.md")
            ? "project.md"
            : files[0]?.path
      let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      let toastTimer

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;")
      }

      function slugify(value, used) {
        const base = value
          .toLowerCase()
          .replace(/<[^>]+>/g, "")
          .replace(/[^\p{Letter}\p{Number}\u4e00-\u9fff]+/gu, "-")
          .replace(/^-+|-+$/g, "") || "section"
        const count = used.get(base) || 0
        used.set(base, count + 1)
        return count ? `${base}-${count + 1}` : base
      }

      function extractFrontmatter(content) {
        if (!content.startsWith("---\n")) return { metadata: {}, body: content }
        const end = content.indexOf("\n---\n", 4)
        if (end === -1) return { metadata: {}, body: content }
        const metadata = {}
        content.slice(4, end).split("\n").forEach((line) => {
          const match = line.match(/^([A-Za-z_][\w-]*):\s*(.*)$/)
          if (!match) return
          metadata[match[1]] = match[2].replace(/^(["'])(.*)\1$/, "$2").trim()
        })
        return { metadata, body: content.slice(end + 5) }
      }

      function resourcePath(href, sourcePath) {
        if (/^(?:[a-z]+:|#)/i.test(href)) return href
        const parts = href.startsWith("/") ? [] : sourcePath.split("/").slice(0, -1)
        href.split("/").forEach((part) => {
          if (!part || part === ".") return
          if (part === "..") parts.pop()
          else parts.push(part)
        })
        return parts.join("/")
      }

      function safeLink(href, sourcePath) {
        if (/^(?:https?:|mailto:|tel:|#)/i.test(href)) return href
        if (/^[a-z][a-z0-9+.-]*:/i.test(href)) return null
        return resourcePath(href, sourcePath)
      }

      function safeImage(href, sourcePath) {
        if (/^https?:/i.test(href) || /^data:image\/(?:png|jpeg|gif|webp);base64,/i.test(href)) return href
        if (/^[a-z][a-z0-9+.-]*:/i.test(href)) return null
        return resourcePath(href, sourcePath)
      }

      function resolveDocument(href, sourcePath) {
        const plain = href.split("#")[0].split("?")[0]
        if (!plain || /^(?:[a-z]+:|#)/i.test(href)) return null
        const path = resourcePath(plain, sourcePath)
        if (filesByPath.has(path)) return path
        if (filesByPath.has(`${path}/index.md`)) return `${path}/index.md`
        return null
      }

      function inlineMarkdown(value, sourcePath) {
        const tokens = []
        const stash = (html) => {
          const token = `\u0000${tokens.length}\u0000`
          tokens.push(html)
          return token
        }
        let text = value.replace(/`([^`]+)`/g, (_, code) => stash(`<code>${escapeHtml(code)}</code>`))
        text = text.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+["']([^"']*)["'])?\)/g, (_, alt, href, title) => {
          const src = safeImage(href, sourcePath)
          if (!src) return stash(`<span>${escapeHtml(alt)}</span>`)
          return stash(`<img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}"${title ? ` title="${escapeHtml(title)}"` : ""}>`)
        })
        text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+["']([^"']*)["'])?\)/g, (_, label, href, title) => {
          const internal = resolveDocument(href, sourcePath)
          const safe = safeLink(href, sourcePath)
          if (!internal && !safe) return stash(`<span>${escapeHtml(label)}</span>`)
          const attributes = internal
            ? `href="#${encodeURIComponent(internal)}" data-okf-path="${escapeHtml(internal)}"`
            : href.startsWith("#")
              ? `href="${escapeHtml(href)}"`
              : `href="${escapeHtml(safe)}" target="_blank" rel="noreferrer"`
          return stash(`<a ${attributes}${title ? ` title="${escapeHtml(title)}"` : ""}>${escapeHtml(label)}</a>`)
        })
        text = escapeHtml(text)
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/__([^_]+)__/g, "<strong>$1</strong>")
          .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
          .replace(/(^|[^_])_([^_]+)_/g, "$1<em>$2</em>")
          .replace(/~~([^~]+)~~/g, "<del>$1</del>")
        return text.replace(/\u0000(\d+)\u0000/g, (_, index) => tokens[Number(index)])
      }

      function splitTableRow(line) {
        const normalized = line.trim().replace(/^\|/, "").replace(/\|$/, "")
        const cells = []
        let cell = ""
        let escaped = false
        for (const character of normalized) {
          if (escaped) {
            cell += character
            escaped = false
            continue
          }
          if (character === "\\") {
            escaped = true
            continue
          }
          if (character === "|") {
            cells.push(cell.trim())
            cell = ""
            continue
          }
          cell += character
        }
        cells.push(cell.trim())
        return cells
      }

      function isTableDivider(line) {
        return /^\s*\|?\s*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line)
      }

      function renderMarkdown(markdown, sourcePath) {
        const lines = markdown.replaceAll("\r\n", "\n").split("\n")
        const html = []
        const headings = []
        const usedSlugs = new Map()
        const startsBlock = (index) => {
          const line = lines[index] || ""
          return !line.trim()
            || /^```/.test(line)
            || /^#{1,6}\s+/.test(line)
            || /^\s*(?:[-*_]\s*){3,}$/.test(line)
            || /^>\s?/.test(line)
            || /^\s*[-+*]\s+/.test(line)
            || /^\s*\d+[.)]\s+/.test(line)
            || (line.includes("|") && isTableDivider(lines[index + 1] || ""))
        }

        for (let index = 0; index < lines.length;) {
          const line = lines[index]
          if (!line.trim()) {
            index += 1
            continue
          }

          const fence = line.match(/^```\s*([^\s`]*)\s*$/)
          if (fence) {
            const language = fence[1].toLowerCase()
            const code = []
            index += 1
            while (index < lines.length && !/^```\s*$/.test(lines[index])) {
              code.push(lines[index])
              index += 1
            }
            index += index < lines.length ? 1 : 0
            const source = code.join("\n")
            if (language === "mermaid") {
              html.push(`
                <section class="diagram-card">
                  <header class="diagram-head">
                    <span class="diagram-label">Mermaid 图</span>
                    <div class="diagram-actions">
                      <button class="diagram-button" data-action="zoom-out" title="缩小" aria-label="缩小">−</button>
                      <button class="diagram-button" data-action="zoom-in" title="放大" aria-label="放大">＋</button>
                      <button class="diagram-button" data-action="fit" title="适应画布" aria-label="适应画布">⌖</button>
                      <button class="diagram-button" data-action="expand" title="展开" aria-label="展开">↗</button>
                    </div>
                  </header>
                  <div class="diagram-viewport" tabindex="0" data-mermaid="${escapeHtml(source)}">
                    <div class="diagram-canvas"><div class="diagram-loading">正在绘制图表…</div></div>
                  </div>
                  <details class="diagram-source"><summary>查看 Mermaid 源码</summary><pre>${escapeHtml(source)}</pre></details>
                </section>`)
              continue
            }
            html.push(`<div class="code-block"><span class="code-language">${escapeHtml(language || "text")}</span><pre><code>${escapeHtml(source)}</code></pre></div>`)
            continue
          }

          const heading = line.match(/^(#{1,6})\s+(.+?)\s*#*\s*$/)
          if (heading) {
            const level = heading[1].length
            const label = heading[2]
            const id = slugify(label, usedSlugs)
            headings.push({ level, label: label.replace(/[*_`]/g, ""), id })
            html.push(`<h${level} id="${id}">${inlineMarkdown(label, sourcePath)}</h${level}>`)
            index += 1
            continue
          }

          if (/^\s*(?:[-*_]\s*){3,}$/.test(line)) {
            html.push("<hr>")
            index += 1
            continue
          }

          if (/^>\s?/.test(line)) {
            const quote = []
            while (index < lines.length && /^>\s?/.test(lines[index])) {
              quote.push(lines[index].replace(/^>\s?/, ""))
              index += 1
            }
            html.push(`<blockquote><p>${quote.map((item) => inlineMarkdown(item, sourcePath)).join("<br>")}</p></blockquote>`)
            continue
          }

          if (line.includes("|") && isTableDivider(lines[index + 1] || "")) {
            const header = splitTableRow(line)
            const rows = []
            index += 2
            while (index < lines.length && lines[index].includes("|") && lines[index].trim()) {
              rows.push(splitTableRow(lines[index]))
              index += 1
            }
            html.push(`<div class="table-wrap"><table><thead><tr>${header.map((cell) => `<th>${inlineMarkdown(cell, sourcePath)}</th>`).join("")}</tr></thead><tbody>${rows.map((row) => `<tr>${row.map((cell) => `<td>${inlineMarkdown(cell, sourcePath)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`)
            continue
          }

          const unordered = line.match(/^\s*[-+*]\s+(.+)$/)
          const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/)
          if (unordered || ordered) {
            const tag = unordered ? "ul" : "ol"
            const pattern = unordered ? /^\s*[-+*]\s+(.+)$/ : /^\s*\d+[.)]\s+(.+)$/
            const items = []
            while (index < lines.length) {
              const match = lines[index].match(pattern)
              if (!match) break
              const task = match[1].match(/^\[([ xX])\]\s+(.+)$/)
              items.push(task
                ? `<li class="task"><input type="checkbox" disabled${task[1].toLowerCase() === "x" ? " checked" : ""}>${inlineMarkdown(task[2], sourcePath)}</li>`
                : `<li>${inlineMarkdown(match[1], sourcePath)}</li>`)
              index += 1
            }
            html.push(`<${tag}>${items.join("")}</${tag}>`)
            continue
          }

          const paragraph = [line.trim()]
          index += 1
          while (index < lines.length && !startsBlock(index)) {
            paragraph.push(lines[index].trim())
            index += 1
          }
          html.push(`<p>${inlineMarkdown(paragraph.join(" "), sourcePath)}</p>`)
        }
        return { html: html.join("\n"), headings }
      }

      function renderTree(query = "") {
        const normalized = query.trim().toLowerCase()
        elements.tree.replaceChildren()
        if (normalized) {
          const matches = files.filter((file) => `${file.name}\n${file.title}\n${file.path}\n${file.description}\n${file.content}`.toLowerCase().includes(normalized))
          matches.forEach((file) => elements.tree.append(fileButton(file, true)))
          if (!matches.length) elements.tree.innerHTML = '<div class="empty-state">没有找到匹配的文档。<br>试试更短的关键词。</div>'
          return
        }

        const root = { directories: new Map(), files: [] }
        files.forEach((file) => {
          const parts = file.path.split("/")
          parts.pop()
          let node = root
          parts.forEach((part) => {
            if (!node.directories.has(part)) node.directories.set(part, { directories: new Map(), files: [] })
            node = node.directories.get(part)
          })
          node.files.push(file)
        })

        const appendNode = (node, container, prefix = "") => {
          node.files
            .sort((left, right) => (left.name === "index.md" ? -1 : right.name === "index.md" ? 1 : left.name.localeCompare(right.name, "zh-CN")))
            .forEach((file) => container.append(fileButton(file, false)))
          Array.from(node.directories.entries())
            .sort(([left], [right]) => left.localeCompare(right, "zh-CN"))
            .forEach(([name, child]) => {
              const details = document.createElement("details")
              details.className = "tree-folder"
              details.open = child.files.some((file) => file.path === currentPath) || currentPath.startsWith(`${prefix}${name}/`)
              const summary = document.createElement("summary")
              summary.textContent = name
              const children = document.createElement("div")
              children.className = "tree-children"
              appendNode(child, children, `${prefix}${name}/`)
              details.append(summary, children)
              container.append(details)
            })
        }
        appendNode(root, elements.tree)
      }

      function fileButton(file, showPath) {
        const button = document.createElement("button")
        button.className = `file-link${file.path === currentPath ? " is-active" : ""}`
        button.dataset.path = file.path
        button.title = file.path
        button.innerHTML = `<span class="file-name">${escapeHtml(file.name)}</span><span class="file-kind">${escapeHtml(file.type)}</span>${showPath ? `<span class="search-path">${escapeHtml(file.path)}</span>` : ""}`
        button.addEventListener("click", () => openDocument(file.path))
        return button
      }

      function renderOutline(headings) {
        const visible = headings.filter((heading) => heading.level >= 2)
        if (!visible.length) {
          elements.outline.replaceChildren()
          return
        }
        elements.outline.innerHTML = `<div class="outline-title">本页目录</div>${visible.map((heading) => `<a href="#${escapeHtml(heading.id)}" data-level="${heading.level}">${escapeHtml(heading.label)}</a>`).join("")}`
        elements.outline.querySelectorAll("a").forEach((anchor) => anchor.addEventListener("click", (event) => {
          event.preventDefault()
          document.getElementById(anchor.getAttribute("href").slice(1))?.scrollIntoView({ behavior: "smooth" })
        }))
      }

      async function renderDiagrams() {
        if (!globalThis.mermaid) return
        globalThis.mermaid.initialize({
          startOnLoad: false,
          securityLevel: "strict",
          theme: theme === "dark" ? "dark" : "neutral",
          fontFamily: getComputedStyle(document.body).fontFamily,
          flowchart: { htmlLabels: true, curve: "basis" },
          sequence: { useMaxWidth: false },
        })
        const viewports = Array.from(elements.document.querySelectorAll(".diagram-viewport"))
        for (const [index, viewport] of viewports.entries()) {
          const canvas = viewport.querySelector(".diagram-canvas")
          try {
            const result = await globalThis.mermaid.render(`okf-diagram-${Date.now()}-${index}`, viewport.dataset.mermaid)
            canvas.innerHTML = result.svg
            setupPanZoom(viewport.closest(".diagram-card"), viewport, canvas)
          } catch (error) {
            canvas.innerHTML = `<pre class="diagram-error">图表渲染失败\n\n${escapeHtml(error?.message || String(error))}</pre>`
          }
        }
      }

      function setupPanZoom(card, viewport, canvas) {
        const svg = canvas.querySelector("svg")
        if (!svg) return
        const viewBox = svg.viewBox?.baseVal
        const width = viewBox?.width || Number.parseFloat(svg.getAttribute("width")) || svg.getBoundingClientRect().width || 800
        const height = viewBox?.height || Number.parseFloat(svg.getAttribute("height")) || svg.getBoundingClientRect().height || 500
        svg.style.width = `${width}px`
        svg.style.height = `${height}px`
        const state = { x: 0, y: 0, scale: 1, width, height, dragging: false, pointerX: 0, pointerY: 0, originX: 0, originY: 0 }
        diagramStates.set(card, state)

        const apply = () => { canvas.style.transform = `translate3d(${state.x}px, ${state.y}px, 0) scale(${state.scale})` }
        const fit = () => {
          const bounds = viewport.getBoundingClientRect()
          state.scale = Math.max(0.08, Math.min(1.35, (bounds.width - 52) / state.width, (bounds.height - 52) / state.height))
          state.x = (bounds.width - state.width * state.scale) / 2
          state.y = (bounds.height - state.height * state.scale) / 2
          apply()
        }
        const zoom = (factor, clientX, clientY) => {
          const bounds = viewport.getBoundingClientRect()
          const pointX = clientX === undefined ? bounds.width / 2 : clientX - bounds.left
          const pointY = clientY === undefined ? bounds.height / 2 : clientY - bounds.top
          const next = Math.max(0.08, Math.min(8, state.scale * factor))
          state.x = pointX - ((pointX - state.x) / state.scale) * next
          state.y = pointY - ((pointY - state.y) / state.scale) * next
          state.scale = next
          apply()
        }
        state.fit = fit
        state.zoom = zoom
        requestAnimationFrame(fit)

        viewport.addEventListener("wheel", (event) => {
          event.preventDefault()
          zoom(Math.exp(-event.deltaY * 0.0015), event.clientX, event.clientY)
        }, { passive: false })
        viewport.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return
          state.dragging = true
          state.pointerX = event.clientX
          state.pointerY = event.clientY
          state.originX = state.x
          state.originY = state.y
          viewport.setPointerCapture(event.pointerId)
        })
        viewport.addEventListener("pointermove", (event) => {
          if (!state.dragging) return
          state.x = state.originX + event.clientX - state.pointerX
          state.y = state.originY + event.clientY - state.pointerY
          apply()
        })
        const stopDrag = () => { state.dragging = false }
        viewport.addEventListener("pointerup", stopDrag)
        viewport.addEventListener("pointercancel", stopDrag)
        viewport.addEventListener("dblclick", fit)
        viewport.addEventListener("keydown", (event) => {
          if (event.key === "+" || event.key === "=") zoom(1.2)
          if (event.key === "-") zoom(1 / 1.2)
          if (event.key === "0") fit()
        })

        card.querySelector("[data-action='zoom-in']").addEventListener("click", () => zoom(1.2))
        card.querySelector("[data-action='zoom-out']").addEventListener("click", () => zoom(1 / 1.2))
        card.querySelector("[data-action='fit']").addEventListener("click", fit)
        card.querySelector("[data-action='expand']").addEventListener("click", () => {
          card.classList.toggle("is-expanded")
          document.body.classList.toggle("has-expanded-diagram", card.classList.contains("is-expanded"))
          requestAnimationFrame(fit)
        })
      }

      function documentHeader(file, metadata) {
        const entries = Object.entries(metadata).filter(([key, value]) => value && !["title", "description"].includes(key))
        return `<header class="doc-header">
          <div class="doc-eyebrow">${escapeHtml(metadata.type || file.type || "Document")}</div>
          <h1 class="doc-title">${escapeHtml(metadata.title || file.title)}</h1>
          ${metadata.description || file.description ? `<p class="doc-description">${escapeHtml(metadata.description || file.description)}</p>` : ""}
          ${entries.length ? `<div class="metadata">${entries.map(([key, value]) => `<span class="metadata-item"><span class="metadata-key">${escapeHtml(key)} · </span>${escapeHtml(value)}</span>`).join("")}</div>` : ""}
        </header>`
      }

      function openDocument(path, updateHash = true) {
        const file = filesByPath.get(path)
        if (!file) return
        currentPath = path
        const parsed = extractFrontmatter(file.content)
        const rendered = renderMarkdown(parsed.body, path)
        elements.path.textContent = path
        elements.document.innerHTML = `${documentHeader(file, parsed.metadata)}<div class="markdown-body">${rendered.html}</div>`
        document.title = `${parsed.metadata.title || file.title} · OKF`
        renderOutline(rendered.headings)
        renderTree(elements.search.value)
        renderDiagrams()
        closeSidebar()
        if (updateHash && decodeURIComponent(location.hash.slice(1)) !== path) history.pushState(null, "", `#${encodeURIComponent(path)}`)
        scrollTo({ top: 0, behavior: "auto" })
      }

      function openSidebar() {
        if (!matchMedia("(max-width: 760px)").matches) {
          document.body.classList.remove("sidebar-collapsed")
          updateMenuState()
          return
        }
        elements.sidebar.classList.add("is-open")
        elements.scrim.classList.add("is-open")
        updateMenuState()
      }
      function closeSidebar() {
        if (!matchMedia("(max-width: 760px)").matches) return
        elements.sidebar.classList.remove("is-open")
        elements.scrim.classList.remove("is-open")
        updateMenuState()
      }
      function updateMenuState() {
        const expanded = matchMedia("(max-width: 760px)").matches
          ? elements.sidebar.classList.contains("is-open")
          : !document.body.classList.contains("sidebar-collapsed")
        const label = expanded ? "收起文件目录" : "展开文件目录"
        elements.menu.setAttribute("aria-expanded", String(expanded))
        elements.menu.setAttribute("aria-label", label)
        elements.menu.title = label
      }
      function toggleSidebar() {
        if (matchMedia("(max-width: 760px)").matches) {
          if (elements.sidebar.classList.contains("is-open")) closeSidebar()
          else openSidebar()
          return
        }
        document.body.classList.toggle("sidebar-collapsed")
        updateMenuState()
      }
      function showToast(message) {
        clearTimeout(toastTimer)
        elements.toast.textContent = message
        elements.toast.classList.add("is-visible")
        toastTimer = setTimeout(() => elements.toast.classList.remove("is-visible"), 1800)
      }

      function copyText(value) {
        const fallback = () => {
          const input = document.createElement("textarea")
          input.value = value
          input.style.position = "fixed"
          input.style.opacity = "0"
          document.body.append(input)
          input.select()
          document.execCommand("copy")
          input.remove()
          showToast("已复制文档路径")
        }
        if (!navigator.clipboard?.writeText) return fallback()
        navigator.clipboard.writeText(value).then(() => showToast("已复制文档路径")).catch(fallback)
      }

      elements.search.addEventListener("input", () => renderTree(elements.search.value))
      elements.menu.addEventListener("click", toggleSidebar)
      elements.scrim.addEventListener("click", closeSidebar)
      elements.copy.addEventListener("click", () => copyText(currentPath))
      elements.theme.addEventListener("click", () => {
        theme = theme === "dark" ? "light" : "dark"
        document.documentElement.dataset.theme = theme
        openDocument(currentPath, false)
      })
      elements.document.addEventListener("click", (event) => {
        const anchor = event.target.closest("a[data-okf-path]")
        if (!anchor) return
        event.preventDefault()
        openDocument(anchor.dataset.okfPath)
      })
      addEventListener("popstate", () => {
        const path = decodeURIComponent(location.hash.slice(1))
        if (filesByPath.has(path) && path !== currentPath) openDocument(path, false)
      })
      addEventListener("resize", () => {
        if (!matchMedia("(max-width: 760px)").matches) {
          elements.sidebar.classList.remove("is-open")
          elements.scrim.classList.remove("is-open")
        }
        updateMenuState()
      })
      addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeSidebar()
          const expanded = document.querySelector(".diagram-card.is-expanded")
          if (expanded) {
            expanded.classList.remove("is-expanded")
            document.body.classList.remove("has-expanded-diagram")
            requestAnimationFrame(() => diagramStates.get(expanded)?.fit())
          }
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault()
          elements.search.focus()
        }
      })

      document.documentElement.dataset.theme = theme
      updateMenuState()
      elements.count.textContent = `${files.length} FILES`
      if (currentPath) openDocument(currentPath, false)
      else elements.document.innerHTML = '<div class="empty-state">这个 OKF 目录中还没有 Markdown 文档。</div>'
    })()
  </script>
</body>
</html>
